# Cấu hình Cloudflare Worker cho Xưởng dép.
# Trước khi `wrangler deploy` lần đầu: tạo D1 và R2 (xem docs/TRIEN-KHAI.md) rồi dán database_id vào dưới.
name = "xuong-dep"
main = "dist/worker.js"
compatibility_date = "2026-11-01"
workers_dev = true
account_id = "241413186f1bf118da6e5be9745f4036"

[[d1_databases]]
binding = "DB"
database_name = "xuong-dep"
database_id = "a3c21e80-1464-4321-b1ad-e170f192e993"
migrations_dir = "migrations"

[[r2_buckets]]
binding = "IMAGES"
bucket_name = "xuong-dep-anh"

# Địa chỉ chính của web: link báo giá, link trong email, và nơi www.… / …workers.dev tự chuyển về.
# Tên miền hluxurystore.com và www.hluxurystore.com gắn vào Worker trong Cloudflare (Settings → Domains & Routes).
[vars]
APP_URL = "https://hluxurystore.com"
